<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HRYAK_CLICKER // 01</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050505; color: #fff; font-family: monospace; min-height: 100vh; overflow: hidden; user-select: none; display: flex; flex-direction: column; justify-content: space-between; }
canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.hud { position: relative; z-index: 10; text-align: center; padding: 20px 10px 0; }
#score { font-size: 46px; font-weight: 900; letter-spacing: 3px; text-shadow: -3px 0 #ff003c, 3px 0 #00f0ff; }
#sub { font-size: 14px; color: #0ff; margin-top: 6px; letter-spacing: 1px; }
.arena { position: relative; z-index: 10; flex: 1; display: flex; justify-content: center; align-items: center; }
#pig-btn { cursor: pointer; transition: transform 0.06s; filter: drop-shadow(-6px 0 0 #ff003c) drop-shadow(6px 0 0 #00f0ff); }
#pig-btn:active { transform: scale(0.91) rotate(-2deg); filter: drop-shadow(8px 0 0 #00ff41) drop-shadow(-8px 0 0 #ff003c); }
#pig-btn svg { width: min(65vw, 310px); display: block; }
.shop { position: relative; z-index: 10; background: rgba(10,10,14,0.92); border-top: 2px solid #fff; box-shadow: 0 -4px 0 #ff003c; padding: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; max-width: 1000px; width: 100%; margin: 0 auto; }
.item { background: #0c0c10; border: 1px solid #555; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: -3px 0 0 #ff003c, 3px 0 0 #00f0ff; }
.item:hover { border-color: #fff; background: #16161d; }
.item.lock { opacity: 0.45; cursor: not-allowed; }
.iname { font-weight: 900; font-size: 14px; }
.idesc { font-size: 11px; color: #0ff; margin-top: 3px; }
.icost { font-weight: 900; color: #ff003c; font-size: 15px; text-align: right; }
.ilvl { font-size: 11px; color: #888; }
.pop { position: fixed; z-index: 30; font-weight: 900; font-size: 22px; color: #fff; text-shadow: -2px 0 #ff003c, 2px 0 #00f0ff; pointer-events: none; animation: fly 0.75s ease-out forwards; }
@keyframes fly { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-75px) scale(1.25); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div id="score">0</div>
  <div id="sub">КЛИК: +1 // АВТО: 0/СЕК</div>
</div>
<div class="arena">
  <div id="pig-btn" onclick="tap(event)">
    <svg viewBox="0 0 320 300">
      <path d="M125 46 Q160 32 195 46 L190 56 Q160 46 130 56 Z" fill="#2b1b17"/>
      <path d="M125 50 C92 75 65 140 68 205 C71 255 115 274 165 274 C225 274 268 248 265 190 C262 135 225 72 195 50 Z" fill="#e5a996" stroke="#2b1b17" stroke-width="4"/>
      <path d="M88 185 Q140 205 235 175 M82 212 Q145 234 248 202 M90 238 Q155 258 240 230" fill="none" stroke="#9e6252" stroke-width="3.5"/>
      <circle cx="136" cy="84" r="5" fill="#1a1110"/>
      <circle cx="182" cy="84" r="5" fill="#1a1110"/>
      <ellipse cx="122" cy="142" rx="48" ry="36" fill="#f2b5a7" stroke="#2b1b17" stroke-width="4"/>
      <ellipse cx="104" cy="142" rx="9" ry="13" fill="#4a2520"/>
      <ellipse cx="138" cy="142" rx="9" ry="13" fill="#4a2520"/>
      <path d="M108 266 L104 286 L116 286 L118 268 M212 264 L216 285 L228 285 L224 262" fill="#c78876" stroke="#2b1b17" stroke-width="3"/>
    </svg>
  </div>
</div>
<div class="shop" id="shop"></div>
<script>
let pts = Number(localStorage.getItem('hp_pts')) || 0;
let upg = JSON.parse(localStorage.getItem('hp_upg')) ||;
const items = [
  { name: "ЖЁЛУДЬ_01", desc: "+1 к силе клика", base: 15, c: 1, p: 0 },
  { name: "RGB_КОРЫТО", desc: "+2 очка в секунду", base: 50, c: 0, p: 2 },
  { name: "КИБЕР_ПЯТАК", desc: "+6 к силе клика", base: 180, c: 6, p: 0 },
  { name: "ФЕРМА_ХРЯКОВ", desc: "+15 очков в секунду", base: 500, c: 0, p: 15 }
];

function getStats() {
  let click = 1 + upg[0] * 1 + upg[2] * 6;
  let perSec = upg[1] * 2 + upg[3] * 15;
  return { click: click, perSec: perSec };
}

function getCost(i) {
  return Math.floor(items[i].base * Math.pow(1.45, upg[i]));
}

function beep(freq) {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.18, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, a.currentTime + 0.08);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + 0.08);
  } catch (e) {}
}

function tap(e) {
  const st = getStats();
  pts += st.click;
  beep(190 + Math.random() * 90);
  const el = document.createElement('div');
  el.className = 'pop';
  el.textContent = '+' + st.click;
  el.style.left = (e.clientX - 15) + 'px';
  el.style.top = (e.clientY - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 750);
  saveAndDraw();
}

function buy(i) {
  const cost = getCost(i);
  if (pts < cost) return;
  pts -= cost;
  upg[i]++;
  beep(520);
  saveAndDraw();
}

function saveAndDraw() {
  localStorage.setItem('hp_pts', pts);
  localStorage.setItem('hp_upg', JSON.stringify(upg));
  const st = getStats();
  document.getElementById('score').textContent = Math.floor(pts);
  document.getElementById('sub').textContent = 'КЛИК: +' + st.click + ' // АВТО: ' + st.perSec + '/СЕК';
  const box = document.getElementById('shop');
  box.innerHTML = '';
  for (let i = 0; i < items.length; i++) {
    const cost = getCost(i);
    const d = document.createElement('div');
    d.className = 'item' + (pts < cost ? ' lock' : '');
    d.onclick = function() { buy(i); };
    d.innerHTML = '<div><div class="iname">' + items[i].name + '</div><div class="idesc">' + items[i].desc + '</div></div><div><div class="icost">' + cost + '</div><div class="ilvl">УР. ' + upg[i] + '</div></div>';
    box.appendChild(d);
  }
}

setInterval(function() {
  const st = getStats();
  if (st.perSec > 0) {
    pts += st.perSec / 10;
    saveAndDraw();
  }
}, 100);

const c = document.getElementById('c'), x = c.getContext('2d');
let cols = [];
function rsz() { c.width = innerWidth; c.height = innerHeight; cols = []; for (let i = 0; i < c.width / 18; i++) cols.push(Math.random() * c.height); }
window.onresize = rsz; rsz();
function rain() {
  requestAnimationFrame(rain);
  x.fillStyle = 'rgba(5,5,5,0.3)'; x.fillRect(0, 0, c.width, c.height);
  x.font = '14px monospace';
  for (let i = 0; i < cols.length; i++) {
    x.fillStyle = Math.random() > 0.9 ? '#ff003c' : '#00f0ff';
    x.fillText(Math.random() > 0.5 ? '1' : '0', i * 18, cols[i]);
    cols[i] += 16; if (cols[i] > c.height && Math.random() > 0.95) cols[i] = 0;
  }
}
saveAndDraw();
rain();
</script>
</body>
</html>
