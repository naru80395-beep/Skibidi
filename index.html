  <script>
    let pts = Number(localStorage.getItem('hp_pts')) || 0;
    let saved = localStorage.getItem('hp_upg');
    let upg = saved ? JSON.parse(saved) : new Array(0, 0, 0, 0);
    let actx = null;

    const items = new Array(
      { name: "ЖЁЛУДЬ_01", desc: "+1 к силе клика", base: 15 },
      { name: "RGB_КОРЫТО", desc: "+2 очка в секунду", base: 50 },
      { name: "КИБЕР_ПЯТАК", desc: "+6 к силе клика", base: 180 },
      { name: "ФЕРМА_ХРЯКОВ", desc: "+15 очков в секунду", base: 500 }
    );

    function getStats() {
      const u0 = upg.at(0) || 0;
      const u1 = upg.at(1) || 0;
      const u2 = upg.at(2) || 0;
      const u3 = upg.at(3) || 0;
      return {
        click: 1 + u0 * 1 + u2 * 6,
        perSec: u1 * 2 + u3 * 15
      };
    }

    function getCost(i) {
      return Math.floor(items.at(i).base * Math.pow(1.45, upg.at(i) || 0));
    }

    function playTapSound(isBuy) {
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        const t = actx.currentTime;
        const o = actx.createOscillator();
        const g = actx.createGain();

        if (isBuy) {
          o.type = 'square';
          o.frequency.setValueAtTime(380, t);
          o.frequency.linearRampToValueAtTime(760, t + 0.12);
        } else {
          o.type = 'sawtooth';
          const baseF = 110 + Math.random() * 45;
          o.frequency.setValueAtTime(baseF, t);
          o.frequency.linearRampToValueAtTime(baseF * 1.65, t + 0.05);
          o.frequency.linearRampToValueAtTime(baseF * 0.7, t + 0.11);
        }

        g.gain.setValueAtTime(0.25, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        o.connect(g);
        g.connect(actx.destination);
        o.start(t);
        o.stop(t + 0.12);
      } catch (e) {}
    }

    function tap(e) {
      const st = getStats();
      pts += st.click;
      playTapSound(false);

      const el = document.createElement('div');
      el.className = 'pop';
      el.textContent = '+' + st.click;
      el.style.left = (e.clientX - 15) + 'px';
      el.style.top = (e.clientY - 20) + 'px';
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 750);

      saveAndDraw();
    }

    function buy(i) {
      const cost = getCost(i);
      if (pts < cost) return;
      pts -= cost;
      upg.splice(i, 1, (upg.at(i) || 0) + 1);
      playTapSound(true);
      saveAndDraw();
    }

    function saveAndDraw() {
      localStorage.setItem('hp_pts', pts);
      localStorage.setItem('hp_upg', JSON.stringify(upg));

      const st = getStats();
      document.getElementById('score').textContent = Math.floor(pts);
      document.getElementById('sub').textContent = 'КЛИК: +' + st.click + ' // АВТО: ' + st.perSec + '/СЕК';

      const box = document.getElementById('shop');
      if (!box) return;
      box.innerHTML = '';

      for (let i = 0; i < items.length; i++) {
        const it = items.at(i);
        const cost = getCost(i);
        const d = document.createElement('div');
        d.className = 'item' + (pts < cost ? ' lock' : '');
        d.onclick = function() { buy(i); };
        d.innerHTML = '<div><div class="iname">' + it.name + '</div><div class="idesc">' + it.desc + '</div></div><div><div class="icost">' + cost + '</div><div class="ilvl">УР. ' + (upg.at(i) || 0) + '</div></div>';
        box.appendChild(d);
      }
    }

    setInterval(function() {
      const st = getStats();
      if (st.perSec > 0) {
        pts += st.perSec / 10;
        saveAndDraw();
      }
    }, 100);

    const c = document.getElementById('c');
    if (c) {
      const x = c.getContext('2d');
      let cols = new Array();

      function rsz() {
        c.width = innerWidth;
        c.height = innerHeight;
        cols = new Array();
        for (let i = 0; i < c.width / 18; i++) cols.push(Math.random() * c.height);
      }

      window.onresize = rsz;
      rsz();

      function rain() {
        requestAnimationFrame(rain);
        x.fillStyle = 'rgba(5,5,5,0.3)';
        x.fillRect(0, 0, c.width, c.height);
        x.font = '14px monospace';
        for (let i = 0; i < cols.length; i++) {
          x.fillStyle = Math.random() > 0.9 ? '#ff003c' : '#00f0ff';
          x.fillText(Math.random() > 0.5 ? '1' : '0', i * 18, cols.at(i));
          cols.splice(i, 1, cols.at(i) + 16);
          if (cols.at(i) > c.height && Math.random() > 0.95) cols.splice(i, 1, 0);
        }
      }
      rain();
    }

    saveAndDraw();
  </script>
</body>
</html>
