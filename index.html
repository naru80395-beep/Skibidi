<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>HRYAK_ANIME // LIVE_DB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden;user-select:none}
.scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);pointer-events:none;z-index:50}
#intro{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:20}
#btn{padding:26px 50px;font-size:24px;font-weight:900;font-family:inherit;letter-spacing:4px;color:#fff;background:#0a0a0a;border:2px solid #fff;cursor:pointer;box-shadow:-5px 0 0 #ff003c,5px 0 0 #00f0ff;text-shadow:-2px 0 #ff003c,2px 0 #00f0ff}
#btn.act{animation:g .15s infinite;background:#1a0008}
#bw{position:fixed;bottom:0;left:0;width:100%;height:14px;background:#111;z-index:25}
#bar{width:0;height:100%;background:linear-gradient(90deg,#ff003c,#00f0ff)}
#scare{position:fixed;inset:0;background:#ff003c;z-index:60;display:none;justify-content:center;align-items:center;font-size:11vw;font-weight:900;color:#000;text-shadow:-8px 0 #00f0ff,8px 0 #fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:1}
#pig-bg{position:fixed;inset:0;display:none;justify-content:center;align-items:center;z-index:2;pointer-events:none;opacity:.35;animation:pig 4s infinite}
#pig-bg svg{width:min(82vw,620px);filter:drop-shadow(-7px 0 0 #ff003c) drop-shadow(7px 0 0 #00f0ff)}
#main{position:relative;z-index:10;display:none;max-width:1150px;margin:0 auto;padding:30px 20px 60px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:25px;border-bottom:2px solid #fff;padding-bottom:15px;box-shadow:0 4px 0 #ff003c}
h1{font-size:24px;letter-spacing:2px;text-shadow:-2px 0 #ff003c,2px 0 #00f0ff}
.sbox{display:flex;gap:8px}
#q{background:#0a0a0a;border:2px solid #fff;color:#fff;padding:10px 14px;font-family:inherit;font-size:15px;width:240px;box-shadow:-3px 0 0 #ff003c,3px 0 0 #00f0ff;outline:none}
#sb{padding:10px 18px;background:#fff;color:#000;font-weight:900;font-family:inherit;border:none;cursor:pointer;box-shadow:-3px 0 0 #ff003c,3px 0 0 #00f0ff}
#sb:hover{background:#ff003c;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:rgba(10,10,12,.88);border:1px solid #444;padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:-4px 0 0 #ff003c,4px 0 0 #00f0ff;transition:.15s}
.card:hover{transform:translateY(-4px);border-color:#fff}
.poster{width:100%;height:260px;object-fit:cover;margin-bottom:10px;border:1px solid #333}
.ttl{font-size:16px;font-weight:900;margin-bottom:8px;line-height:1.25}
.rt{display:flex;justify-content:space-between;margin-bottom:12px;font-size:13px;font-weight:700;color:#00ff88}
.go{display:block;text-align:center;padding:10px;background:#fff;color:#000;font-weight:900;text-decoration:none;letter-spacing:2px;box-shadow:-3px 0 0 #ff003c,3px 0 0 #00f0ff}
.go:hover{background:#ff003c;color:#fff}
#st{text-align:center;padding:30px;font-size:18px;color:#00f0ff;display:none}
@keyframes g{0%{box-shadow:-7px 0 0 #ff003c,7px 0 0 #00f0ff}50%{box-shadow:7px -3px 0 #00ff41,-7px 3px 0 #ff003c}100%{box-shadow:-6px 2px 0 #00f0ff,6px -2px 0 #ff003c}}
@keyframes pig{0%,94%,100%{transform:translate(0) scale(1)}96%{transform:translate(-6px,2px) scale(1.02)}98%{transform:translate(6px,-2px) scale(.99)}}
</style>
</head>
<body>
<div class="scan"></div>
<div id="intro"><button id="btn">ДЕРЖИ КУРСОР 10 СЕК</button><div id="bw"><div id="bar"></div></div></div>
<div id="scare">01_ХРЯК_01</div>
<canvas id="c"></canvas>
<div id="pig-bg">
<svg viewBox="0 0 320 300">
<path d="M125 46 Q160 32 195 46 L190 56 Q160 46 130 56 Z" fill="#2b1b17"/>
<path d="M125 50 C92 75 65 140 68 205 C71 255 115 274 165 274 C225 274 268 248 265 190 C262 135 225 72 195 50 Z" fill="#e5a996" stroke="#2b1b17" stroke-width="4"/>
<path d="M88 185 Q140 205 235 175 M82 212 Q145 234 248 202 M90 238 Q155 258 240 230" fill="none" stroke="#9e6252" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="136" cy="84" r="5" fill="#1a1110"/><circle cx="138" cy="82" r="1.5" fill="#fff"/>
<circle cx="182" cy="84" r="5" fill="#1a1110"/><circle cx="184" cy="82" r="1.5" fill="#fff"/>
<ellipse cx="122" cy="142" rx="48" ry="36" fill="#f2b5a7" stroke="#2b1b17" stroke-width="4"/>
<ellipse cx="104" cy="142" rx="9" ry="13" fill="#4a2520"/><ellipse cx="138" cy="142" rx="9" ry="13" fill="#4a2520"/>
<path d="M108 266 L104 286 L116 286 L118 268 M212 264 L216 285 L228 285 L224 262" fill="#c78876" stroke="#2b1b17" stroke-width="3"/>
</svg>
</div>
<div id="main">
<div class="top"><h1>HRYAK_ARCHIVE // LIVE_DB</h1><div class="sbox"><input id="q" placeholder="One Piece, Naruto..." onkeydown="if(event.key==='Enter')loadAnime()"><button id="sb" onclick="loadAnime()">НАЙТИ</button></div></div>
<div id="st">ЗАГРУЗКА ИЗ АРХИВА...</div>
<div class="grid" id="grid"></div>
</div>
<script>
const btn=document.getElementById('btn'),bar=document.getElementById('bar'),intro=document.getElementById('intro'),scare=document.getElementById('scare'),c=document.getElementById('c'),x=c.getContext('2d'),pig=document.getElementById('pig-bg'),main=document.getElementById('main'),grid=document.getElementById('grid'),st=document.getElementById('st');
let w,ht,hold=0,hov=0,last=0,done=0,actx,cols=[];
function rsz(){w=c.width=innerWidth;ht=c.height=innerHeight;cols=Array(Math.floor(w/18)).fill(0).map(()=>Math.random()*ht)}
addEventListener('resize',rsz);rsz();
function aud(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}
addEventListener('pointerdown',aud);
btn.addEventListener('pointerenter',()=>{aud();hov=1;btn.classList.add('act')});
btn.addEventListener('pointerleave',()=>{if(!done){hov=0;hold=0;bar.style.width='0%';btn.classList.remove('act')}});
function scream(){
aud();const t=actx.currentTime,g=actx.createGain();g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.01,t+1.1);g.connect(actx.destination);
const fr=[420,890,1450];for(let i=0;i<fr.length;i++){const o=actx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(fr[i],t);o.frequency.linearRampToValueAtTime(fr[i]*1.8,t+.2);o.connect(g);o.start(t);o.stop(t+1.1)}
}
async function loadAnime(){
const q=document.getElementById('q').value.trim();
st.style.display='block';grid.innerHTML='';
const api=q?'https://jikan.moe';
try{
const res=await fetch(api);const json=await res.json();st.style.display='none';
const list=json.data||[];let out='';
for(let i=0;i<list.length;i++){
const a=list[i];const img=a.images.jpg.image_url;const sc=a.score||'—';const ep=a.episodes?a.episodes+' эп.':'онгоинг';
out+='<div class="card"><div><img class="poster" src="'+img+'"><div class="ttl">'+a.title+'</div></div><div><div class="rt"><span>★ '+sc+'</span><span>'+ep+'</span></div><a class="go" target="_blank" href="'+a.url+'">СМОТРЕТЬ</a></div></div>';
}
grid.innerHTML=out||'<div style="color:#ff003c">НИЧЕГО НЕ НАЙДЕНО</div>';
}catch(e){st.textContent='ОШИБКА СОЕДИНЕНИЯ С АРХИВОМ'}
}
function go(){
done=1;intro.style.display='none';scare.style.display='flex';scream();
let f=0;const iv=setInterval(()=>{scare.style.background=f++%2?'#000':'#ff003c';scare.style.color=f%2?'#ff003c':'#fff'},50);
setTimeout(()=>{clearInterval(iv);scare.style.display='none';c.style.display='block';pig.style.display='flex';main.style.display='block';loadAnime()},750);
}
function loop(now){
requestAnimationFrame(loop);const dt=now-last;last=now;
if(hov&&!done){hold+=dt;bar.style.width=Math.min(100,hold/100)+'%';btn.textContent='ДЕРЖИ: '+Math.max(0,10-hold/1000).toFixed(1)+'с';if(hold>=10000)go()}
else if(!done)btn.textContent='ДЕРЖИ КУРСОР 10 СЕК';
if(!done)return;
x.fillStyle='rgba(5,5,5,.3)';x.fillRect(0,0,w,ht);x.font='14px "Courier New",monospace';
for(let i=0;i<cols.length;i++){x.fillStyle=Math.random()>.92?'rgba(255,0,60,.4)':'rgba(0,240,255,.22)';x.fillText(Math.random()>.5?'1':'0',i*18,cols[i]);cols[i]+=16;if(cols[i]>ht&&Math.random()>.95)cols[i]=0}
}
requestAnimationFrame(loop);
</script>
</body>
</html>
